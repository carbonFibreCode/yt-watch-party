# Load balancer for the `scale` profile (LLD SP-19 §3). Clients use WebSocket-only transport, so
# no sticky sessions: any instance can serve any socket, and least_conn spreads them evenly.
worker_processes auto;

events {
  # Each proxied WebSocket holds two connections (client + upstream); the default 1024 per worker
  # refused connections in the 5,000-user load test.
  worker_connections 16384;
}

http {
  # Records which replica served each request, to show the spread (see docs/loadtest.md).
  log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr';

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream watchparty {
    least_conn;
    # Resolved at startup to every replica of the `server` service.
    server server:3000;
  }

  server {
    listen 8080;
    access_log /dev/stdout upstream;

    location / {
      proxy_pass http://watchparty;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Long-lived sockets; Socket.IO's own heartbeat detects dead peers.
      proxy_read_timeout 1h;
    }
  }
}
