# Render Blueprint (LLD SP-23): one Node web service serving the SPA, REST API and WebSockets
# from a single origin, plus a Key Value (Redis) instance for shared room state, rate limits and
# cross-instance fan-out (LLD SP-19). Postgres is Neon (DATABASE_URL).
services:
  - type: keyvalue
    name: watch-party-redis
    plan: free
    # Private network only (same region as the web service).
    ipAllowList: []
    # Rooms (archived in Postgres), rate-limit buckets and recovery sessions all carry TTLs and may
    # be evicted under memory pressure; the Socket.IO stream has none, so it never is.
    maxmemoryPolicy: volatile-lru

  - type: web
    name: watch-party
    runtime: node
    plan: free
    # pnpm runs through Corepack at the version pinned in package.json (`corepack enable` would
    # write to the read-only /usr/bin). devDependencies are installed because the build needs Vite
    # and tsdown even though NODE_ENV=production.
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build
    # Plain node: the running app needs no package manager. Migrations run at boot under a
    # Postgres advisory lock (apps/server/src/main.ts).
    startCommand: node apps/server/dist/main.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: '0'
      # Render sits behind Cloudflare, which sets the real client IP here (and overwrites spoofed
      # values). X-Forwarded-For carries several hops, which better-auth will not trust.
      - key: CLIENT_IP_HEADERS
        value: cf-connecting-ip
      # The service's public URL, e.g. https://watch-party.onrender.com (also the auth base URL).
      - key: PUBLIC_ORIGIN
        sync: false
      # Neon *direct* (non-pooler) connection string, with ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Switches every shared-state strategy to Redis (Lua-CAS room store, rate limits, adapter).
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: watch-party-redis
          property: connectionString
